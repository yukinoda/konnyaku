<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    konjac app icon. macOS Big Sur grid: 824 x 824 body centered on a
    1024 canvas, corner radius 185. The body is a grey, speckled konjac
    block; the two speech bubbles carry a hand-drawn "あ" and "A".
  -->
  <defs>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6A2AC"/>
      <stop offset="1" stop-color="#6C6874"/>
    </linearGradient>
    <linearGradient id="bubble-ja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAF0"/>
    </linearGradient>
    <linearGradient id="bubble-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A66"/>
      <stop offset="1" stop-color="#F2603F"/>
    </linearGradient>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Konjac block -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#block)" filter="url(#drop-shadow)"/>

  <!-- Konjac speckles -->
  <g fill="#3E3A44" opacity="0.28">
    <circle cx="190" cy="200" r="9"/>
    <circle cx="300" cy="160" r="6"/>
    <circle cx="700" cy="190" r="8"/>
    <circle cx="840" cy="250" r="7"/>
    <circle cx="830" cy="400" r="9"/>
    <circle cx="170" cy="660" r="8"/>
    <circle cx="230" cy="830" r="7"/>
    <circle cx="380" cy="860" r="9"/>
    <circle cx="160" cy="430" r="6"/>
    <circle cx="560" cy="150" r="6"/>
  </g>

  <!-- Japanese bubble (back) -->
  <g filter="url(#drop-shadow)">
    <path fill="url(#bubble-ja)" d="M 300 220 H 520 A 110 110 0 0 1 630 330 V 470 A 110 110 0 0 1 520 580 H 330 L 240 640 L 254 562 A 110 110 0 0 1 190 470 V 330 A 110 110 0 0 1 300 220 Z"/>
    <g fill="none" stroke="#4A4652" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" transform="translate(395 350) scale(0.78) translate(-395 -396)">
      <path d="M 300 318 Q 390 318 500 306"/>
      <path d="M 388 266 C 384 340 390 440 418 510"/>
      <path d="M 470 370 C 440 450 370 520 310 500 C 260 484 276 420 350 404 C 440 386 520 410 520 456 C 520 500 480 520 440 526"/>
    </g>
  </g>

  <!-- English bubble (front) -->
  <g filter="url(#drop-shadow)" transform="translate(30 20)">
    <path fill="url(#bubble-en)" d="M 504 444 H 724 A 110 110 0 0 1 834 554 V 694 A 110 110 0 0 1 770 786 L 784 864 L 694 804 H 504 A 110 110 0 0 1 394 694 V 554 A 110 110 0 0 1 504 444 Z"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 536 730 L 614 520 L 692 730"/>
      <path d="M 566 662 H 662"/>
    </g>
  </g>
</svg>
