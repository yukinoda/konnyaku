version: 2
updates:
  # Actions are pinned by commit SHA with a version comment; Dependabot
  # updates both. Package.swift's llama.cpp binary target is bumped by hand,
  # and konnyaku.py's dependencies are pinned in its header and in
  # konnyaku.py.lock, both bumped manually.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Titles become "ci(deps): bump ..." so they pass the pr-title check.
    # "ci" fits Actions only; other ecosystems should use "build".
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
