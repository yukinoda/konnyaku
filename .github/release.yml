changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 Features and improvements
      labels:
        - enhancement
        - accessibility
    - title: 🐛 Bug fixes
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔧 Dependencies and maintenance
      labels:
        - dependencies
        - github_actions
    - title: 📦 Other changes
      labels:
        - '*'
