name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels its stale scan. Each main commit gets
# its own group, so no main run is cancelled or dropped while pending.
concurrency:
  group: secrets-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # To bump: pick a release at https://github.com/gitleaks/gitleaks/releases,
      # set the version, then copy the linux_x64 line for it from
      # gitleaks_<version>_checksums.txt into GITLEAKS_SHA256.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL --retry 3 --max-time 120 -o "${RUNNER_TEMP}/${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check -
          mkdir "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/gitleaks" gitleaks

      # Only history reachable from the commit under test (for a PR, the
      # merge commit), not every fetched branch: a secret on some abandoned
      # branch must not block unrelated PRs. --diff-merges=first-parent also
      # scans changes made inside merge commits (e.g. conflict resolutions),
      # which git log -p skips by default.
      - name: Scan history of this commit
        run: |
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --log-opts="--diff-merges=first-parent HEAD" --redact --verbose --exit-code 1 .
