name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build
        run: swift build

      - name: Test
        run: swift test
