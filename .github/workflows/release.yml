name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds and tests with read-only access. Publishing is a separate job, so
  # the build (tests, SwiftPM dependencies) never holds the tokens that write
  # to the repo or sign attestations. The publish job attests whatever this
  # job uploads; it does not re-check the build.
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and all branches, so origin/main exists for the
          # ancestry check below. The token is used only during checkout.
          fetch-depth: 0
          persist-credentials: false

      # A tag push runs the release.yml stored in the tagged commit, so this
      # check is a second layer, not enforcement on its own. The real gate is
      # a tag ruleset restricting who can create v* tags (repo settings).
      - name: Require tagged commit to be on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi

          status=0
          git merge-base --is-ancestor "$TAGGED_SHA" origin/main || status=$?

          if [ "$status" -eq 1 ]; then
            echo "::error::Tagged commit $TAGGED_SHA is not an ancestor of origin/main; refusing to release. If the commit is on your local main, push main first, then re-run this job."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::git merge-base failed with exit code $status"
            exit 1
          fi

      - name: Select Xcode (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test
        run: swift test

      # Tag pushes take the version from the tag. Manual runs are a dry run
      # with a fixed version; the branch name is never used as a version.
      - name: Build DMG
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            KONNYAKU_VERSION="${REF_NAME#v}"
          else
            KONNYAKU_VERSION="0.0.0"
          fi
          export KONNYAKU_VERSION
          scripts/make-dmg.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: konnyaku-dmg
          path: |
            build/Konnyaku-*.dmg
            build/Konnyaku-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
          # The DMG is already compressed.
          compression-level: 0

  # Publish only on a real tag push, never on a manual run (even on a tag).
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: konnyaku-dmg
          path: dist

      # Build provenance: lets anyone check that the DMG was built by this
      # workflow from the tagged commit (`gh attestation verify`).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Konnyaku-*.dmg

      - name: Create GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          # make-dmg.sh owns the arch suffix; the version must match the tag.
          gh release create "$REF_NAME" \
            Konnyaku-"$version"-*.dmg \
            Konnyaku-"$version"-*.dmg.sha256 \
            --title "Konnyaku $version" \
            --generate-notes \
            --verify-tag
