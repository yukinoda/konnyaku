name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test
        run: swift test

      # Tag pushes take the version from the tag. Manual runs are a dry run
      # with a fixed version; the branch name is never used as a version.
      - name: Build DMG
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            KONJAC_VERSION="${REF_NAME#v}"
          else
            KONJAC_VERSION="0.0.0"
          fi
          export KONJAC_VERSION
          scripts/make-dmg.sh

      # Publish only on a real tag push, never on a manual run (even on a tag).
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          gh release create "$REF_NAME" \
            "build/konjac-$version.dmg" \
            "build/konjac-$version.dmg.sha256" \
            --title "konjac $version" \
            --generate-notes \
            --verify-tag
