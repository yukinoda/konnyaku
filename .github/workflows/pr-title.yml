name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|refactor|perf|test|build|ci|chore|revert'
          scope='(\([a-z0-9._/-]+\))?'
          summary='[^[:space:]].*'
          conventional="^($types)${scope}!?: ${summary}"
          # GitHub's Revert button titles the PR: Revert "<original title>"
          github_revert="^Revert \"($types)${scope}!?: ${summary}\"$"
          if [[ "$TITLE" =~ $conventional ]]; then
            echo "OK: $TITLE"
            exit 0
          fi
          if [[ "$TITLE" =~ $github_revert ]]; then
            echo "OK (GitHub revert title): $TITLE"
            exit 0
          fi
          echo "::error::PR title does not follow Conventional Commits."
          echo "Title:    $TITLE"
          echo "Expected: type(optional-scope)!: summary"
          echo "Types:    ${types//|/ }"
          echo "Scope:    optional, lowercase letters, digits and . _ / -"
          echo "Example:  fix(popup): keep the top edge on resize"
          exit 1
